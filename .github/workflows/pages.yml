name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: site
      - uses: actions/checkout@v5
        with:
          repository: polycubing/census
          path: census
          sparse-checkout: |
            /lib/
            /*.gemspec
            /data/*.json
            /data/*/*/shape.json
            /data/*/*/corona*.json
          sparse-checkout-cone-mode: false
          filter: blob:none
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: site
          bundler-cache: true
      - run: cd site && script/build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
